version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: projectpilot-mongodb
    restart: unless-stopped
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_DATABASE: projectpilot
    volumes:
      - mongo_data:/data/db

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: projectpilot-server
    restart: unless-stopped
    ports:
      - '5000:5000'
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/projectpilot
      - JWT_SECRET=projectpilot-super-secret-jwt-key-production-change-me
      - JWT_EXPIRES_IN=7d
      - CLIENT_URL=http://localhost:5173
      - RATE_LIMIT_WINDOW_MS=900000
      - RATE_LIMIT_MAX=500
      - MAX_FILE_SIZE_MB=10
    depends_on:
      - mongodb

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    container_name: projectpilot-client
    restart: unless-stopped
    ports:
      - '5173:80'
    depends_on:
      - server

volumes:
  mongo_data:
